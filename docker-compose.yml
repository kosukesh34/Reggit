services:
  node:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - reggit_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - reggit_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reggit-app
    container_name: reggit_app
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - reggit_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: reggit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reggit
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: reggit_user
    volumes:
      - reggit_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - reggit_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: reggit_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - reggit_network
    depends_on:
      - app
      - reverb

  reverb:
    image: reggit-app
    container_name: reggit_reverb
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    networks:
      - reggit_network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  scheduler:
    image: reggit-app
    container_name: reggit_scheduler
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    networks:
      - reggit_network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  # Web E2E 専用（scripts/e2e-web.sh から起動）。開発用の .env・DB・storage を使わない
  e2e:
    image: reggit-app
    container_name: reggit_e2e
    profiles: ["e2e"]
    environment:
      APP_KEY: ${E2E_APP_KEY:-}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./env.e2e.example:/var/www/html/.env:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    tmpfs:
      - /var/www/html/storage:uid=33,gid=33,mode=0775
    command: ["sh", "-c", "mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && cd public && PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    ports:
      - "8090:8000"
    networks:
      - reggit_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  reggit_node_modules:
    driver: local
  reggit_db_data:
    driver: local

networks:
  reggit_network:
    driver: bridge
