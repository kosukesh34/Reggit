services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reggit_app
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - reggit_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: reggit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reggit
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: reggit_user
    volumes:
      - reggit_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - reggit_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: reggit_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    # 単一ファイル bind は環境によってディレクトリ化して壊れることがあるため、
    # コンテナ起動時に設定をコピーする。
    command:
      - /bin/sh
      - -c
      - |
        rm -f /etc/nginx/conf.d/default.conf
        if [ -f /var/www/html/docker/nginx/reggit.conf ]; then
          cp /var/www/html/docker/nginx/reggit.conf /etc/nginx/conf.d/reggit.conf
        elif [ -f /var/www/html/docker/nginx/default.conf ]; then
          cp /var/www/html/docker/nginx/default.conf /etc/nginx/conf.d/reggit.conf
        else
          echo "nginx config not found" >&2
          exit 1
        fi
        exec nginx -g 'daemon off;'
    networks:
      - reggit_network
    depends_on:
      - app

volumes:
  reggit_db_data:
    driver: local

networks:
  reggit_network:
    driver: bridge

