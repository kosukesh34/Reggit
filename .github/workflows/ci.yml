# E2E 以外のテスト・Lint 用 CI（E2E はローカル実行）。パブリックリポジトリのため実行時間は無料。
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同じ PR に新しい push があれば古い実行を止める
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: testing

jobs:
  # PHP テストをファイル単位で4分割し並列実行する
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reggit_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, mysql, pdo, pdo_mysql, gd, zip
        coverage: none

    # phpunit.xml が APP_ENV=testing を強制するため .env.testing を読む
    - name: Prepare environment file
      run: |
        mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
        cat > .env.testing <<'EOF'
        APP_ENV=testing
        APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        DB_CONNECTION=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=reggit_test
        DB_USERNAME=root
        DB_PASSWORD=root
        CACHE_STORE=array
        SESSION_DRIVER=array
        QUEUE_CONNECTION=sync
        LOG_CHANNEL=stderr
        EOF

    - uses: actions/cache@v4
      id: vendor
      with:
        path: vendor
        key: vendor-php8.4-${{ hashFiles('composer.lock') }}

    - if: steps.vendor.outputs.cache-hit != 'true'
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run tests (shard ${{ matrix.shard }}/4)
      run: |
        files=$(find tests/Unit tests/Feature -name '*Test.php' | sort | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i')
        vendor/bin/phpunit --exclude-group smaregi-integration $files

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: none

    - uses: actions/cache@v4
      id: vendor
      with:
        path: vendor
        key: vendor-php8.4-${{ hashFiles('composer.lock') }}

    - if: steps.vendor.outputs.cache-hit != 'true'
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Merge gate contract tests
      run: python3 -B scripts/tests/test_merge_pr.py

    - name: Run Laravel Pint (code style)
      run: vendor/bin/pint --test

    - name: Run PHPStan
      run: composer analyse

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm ci --ignore-scripts
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run test:unit:frontend
    - run: npm run build

  # マージ判定に使う唯一の必須チェック。依存ジョブが失敗・スキップでも必ず結果を出す
  main:
    runs-on: ubuntu-latest
    needs: [test, lint, frontend]
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          test "$FRONTEND_RESULT" = success
          echo "All CI checks passed"
