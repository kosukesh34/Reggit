# テスト・Lint 用 CI（GitHub 無料アカウントで利用可能）
# パブリックリポジトリ: 実行時間無制限 / プライベート: 月 2,000 分まで無料
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reggit_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, mysql, pdo, pdo_mysql, gd, zip
        coverage: none

    # .env を composer install より前に用意（post-autoload-dump で artisan package:discover が動くため）
    - name: Prepare environment file
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=reggit_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
        else
          echo 'APP_NAME="Reggit"' > .env
          echo 'APP_ENV=testing' >> .env
          echo 'APP_KEY=' >> .env
          echo 'APP_DEBUG=true' >> .env
          echo 'APP_URL=http://localhost' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=127.0.0.1' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=reggit_test' >> .env
          echo 'DB_USERNAME=root' >> .env
          echo 'DB_PASSWORD=root' >> .env
          echo 'SESSION_DRIVER=array' >> .env
          echo 'CACHE_DRIVER=array' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env
        fi

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Generate application key
      run: php artisan key:generate --force

    - name: Setup Database
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --env=testing --force

    - name: Run Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan test

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run Laravel Pint (code style)
      run: |
        if [ -f vendor/bin/pint ]; then
          vendor/bin/pint --test
        else
          echo "Laravel Pint not installed, skipping..."
        fi

