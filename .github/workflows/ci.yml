# テスト・Lint 用 CI（E2E はローカル実行）（GitHub 無料アカウントで利用可能）
# パブリックリポジトリ: 実行時間無制限 / プライベート: 月 2,000 分まで無料
name: CI

on:
  push:
    branches: [ main, develop, ver1.0.0 ]
  pull_request:
    branches: [ main, develop, ver1.0.0, 'feature/**', 'fix/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reggit_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Type check frontend
      run: npx tsc --noEmit

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, mysql, pdo, pdo_mysql, gd, zip
        coverage: none

    # .env を composer install より前に用意（post-autoload-dump で artisan package:discover が動くため）
    - name: Prepare environment file
      run: |
        if [ -f env.example ]; then
          cp env.example .env
        elif [ -f .env.example ]; then
          cp .env.example .env
        else
          echo 'APP_NAME="Reggit"' > .env
          echo 'APP_ENV=testing' >> .env
          echo 'APP_KEY=' >> .env
          echo 'APP_DEBUG=true' >> .env
          echo 'APP_URL=http://localhost' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'SESSION_DRIVER=array' >> .env
          echo 'CACHE_DRIVER=array' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env
        fi
        sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
        sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
        sed -i 's/^DB_DATABASE=.*/DB_DATABASE=reggit_test/' .env
        sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Generate application key
      run: php artisan key:generate --force

    - name: Setup Database
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --env=testing --force

    - name: Run Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
        SMAREGI_CLIENT_ID: ${{ secrets.SMAREGI_CLIENT_ID }}
        SMAREGI_CLIENT_SECRET: ${{ secrets.SMAREGI_CLIENT_SECRET }}
        SMAREGI_TEST_CONTRACT_ID: ${{ secrets.SMAREGI_TEST_CONTRACT_ID }}
        SMAREGI_CONTRACT_ID: ${{ secrets.SMAREGI_CONTRACT_ID }}
      run: php artisan test

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run Laravel Pint (code style)
      run: |
        if [ -f vendor/bin/pint ]; then
          vendor/bin/pint --test
        else
          echo "Laravel Pint not installed, skipping..."
        fi

  # E2E/browser tests run locally. This check fails even when a dependency fails.
  main:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          echo "All CI checks passed"
