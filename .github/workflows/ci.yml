# テスト・Lint・E2E 用 CI（GitHub 無料アカウントで利用可能）
# パブリックリポジトリ: 実行時間無制限 / プライベート: 月 2,000 分まで無料
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'feature/**', 'fix/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reggit_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, mysql, pdo, pdo_mysql, gd, zip
        coverage: none

    # .env を composer install より前に用意（post-autoload-dump で artisan package:discover が動くため）
    - name: Prepare environment file
      run: |
        if [ -f env.example ]; then
          cp env.example .env
        elif [ -f .env.example ]; then
          cp .env.example .env
        else
          echo 'APP_NAME="Reggit"' > .env
          echo 'APP_ENV=testing' >> .env
          echo 'APP_KEY=' >> .env
          echo 'APP_DEBUG=true' >> .env
          echo 'APP_URL=http://localhost' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'SESSION_DRIVER=array' >> .env
          echo 'CACHE_DRIVER=array' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env
        fi
        sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
        sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
        sed -i 's/^DB_DATABASE=.*/DB_DATABASE=reggit_test/' .env
        sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Generate application key
      run: php artisan key:generate --force

    - name: Setup Database
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --env=testing --force

    - name: Run Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan test --exclude-group=smaregi-integration

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run Laravel Pint (code style)
      run: |
        if [ -f vendor/bin/pint ]; then
          vendor/bin/pint --test
        else
          echo "Laravel Pint not installed, skipping..."
        fi

  e2e_web:
    name: E2E Web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reggit_e2e
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, mysql, pdo, pdo_mysql, gd, zip
        coverage: none

    - name: Prepare environment file
      run: |
        cp env.example .env
        sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
        sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' .env
        sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
        sed -i 's/^DB_DATABASE=.*/DB_DATABASE=reggit_e2e/' .env
        sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
        sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
        sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
        sed -i 's/^DEMO_SEED=.*/DEMO_SEED=true/' .env
        # storage/framework は .gitignore のため checkout に無い。セッション無しだと /admin/login が 500 になる
        mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache
        chmod -R ug+rwx storage bootstrap/cache

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Generate application key
      run: php artisan key:generate --force

    - name: Migrate and seed
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_e2e
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    # GHA はステップ終了でバックグラウンドプロセスを殺すため、起動とテストを同一ステップにする
    - name: Start server and run Playwright E2E
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: reggit_e2e
        DB_USERNAME: root
        DB_PASSWORD: root
        E2E_BASE_URL: http://127.0.0.1:8080
        CI: true
        PHP_CLI_SERVER_WORKERS: 4
      run: |
        php artisan serve --host=127.0.0.1 --port=8080 --no-reload > /tmp/artisan-serve.log 2>&1 &
        serve_pid=$!
        cleanup() { kill "$serve_pid" 2>/dev/null || true; }
        trap cleanup EXIT

        for i in $(seq 1 60); do
          code=$(curl -s -o /tmp/e2e-health.out -w "%{http_code}" --max-time 10 http://127.0.0.1:8080/admin/login || echo "000")
          if [ "$code" = "200" ]; then
            echo "Server is up (HTTP $code)"
            break
          fi
          echo "Waiting for server... attempt=$i HTTP=$code"
          if [ "$i" -eq 60 ]; then
            echo "Server failed to become ready"
            echo "---- health body ----"
            head -c 2000 /tmp/e2e-health.out || true
            echo "---- artisan serve log ----"
            cat /tmp/artisan-serve.log || true
            echo "---- laravel log ----"
            tail -n 100 storage/logs/laravel.log 2>/dev/null || true
            exit 1
          fi
          sleep 1
        done

        npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          e2e/web/playwright-report
          e2e/web/test-results
        if-no-files-found: ignore

  # Skip の Android ビルドは macOS + Xcode 依存。ランナーに Skip/AVD が無いと失敗しうるため当面 continue-on-error。
  e2e_mobile:
    name: E2E Mobile (Maestro / Android)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Skip (for Android transpile)
      run: |
        brew install skiptools/skip/skip || brew upgrade skip || true
        skip --version || true

    - name: Create Android AVD
      run: |
        sdkmanager "system-images;android-34;google_apis;arm64-v8a" || sdkmanager "system-images;android-34;google_apis;x86_64"
        echo no | avdmanager create avd -n Pixel_CI -k "system-images;android-34;google_apis;arm64-v8a" --device "pixel_6" || \
          echo no | avdmanager create avd -n Pixel_CI -k "system-images;android-34;google_apis;x86_64" --device "pixel_6"
        echo "ANDROID_AVD=Pixel_CI" >> "$GITHUB_ENV"

    - name: Build and install mobile app
      run: ./scripts/build-and-install-mobile.sh
      env:
        ANDROID_AVD: Pixel_CI
        DESTINATION: 'platform=iOS Simulator,name=iPhone 16'

    - name: Run Maestro flows
      run: ./scripts/e2e-mobile-android.sh

    - name: Upload Maestro artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maestro-tests
        path: ~/.maestro/tests/
        if-no-files-found: ignore

  # ブランチ保護ルールが要求する required status check 名（context: main）
  main:
    runs-on: ubuntu-latest
    needs: [ test, lint, e2e_web ]

    steps:
      - run: echo "All CI checks passed"
