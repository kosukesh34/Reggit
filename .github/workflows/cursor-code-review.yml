# Cursor による PR 自動コードレビュー（オプション）
# レビュー基準: リポジトリルートの CODING_STANDARDS.md（特に「コードレビュー指摘事項」）を参照して指摘する。
# 注意: Cursor CLI 未インストール時・CURSOR_API_KEY 未設定時はレビューをスキップし、ジョブは成功します。
# 通常の CI（テスト・Lint）は .github/workflows/ci.yml で無料で実行されます。
#
# セットアップ: リポジトリの Settings → Secrets and variables → Actions で
#   CURSOR_API_KEY を追加（Cursor ダッシュボードで発行した API キー）
# オプション: Variables で CURSOR_REVIEW_MODEL（例: gpt-4o）, BLOCKING_REVIEW（true/false）を設定可能
name: Cursor Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    # ドラフトPRではスキップ（必要なら if を削除して有効化）
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Cursor CLI は ~/.local/bin にインストールされる（公式ドキュメント）
      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Cursor CLI
        id: verify
        run: |
          if ! command -v agent >/dev/null 2>&1; then
            echo "Cursor CLI (agent) is not available on this runner. Skipping automated code review."
            echo "agent_available=false" >> $GITHUB_OUTPUT
            echo "CRITICAL_ISSUES_FOUND=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "agent_available=true" >> $GITHUB_OUTPUT
          echo "Cursor CLI found: $(command -v agent)"

      - name: Check Cursor API key
        id: check_key
        if: steps.verify.outputs.agent_available == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "Cursor API key is not set. Skipping automated code review (configure CURSOR_API_KEY in repo Secrets to enable)."
            echo "review_skipped=true" >> $GITHUB_OUTPUT
            echo "CRITICAL_ISSUES_FOUND=false" >> $GITHUB_ENV
          else
            echo "review_skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git identity
        run: |
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"

      - name: Perform automated code review
        if: steps.verify.outputs.agent_available == 'true' && steps.check_key.outputs.review_skipped != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ vars.CURSOR_REVIEW_MODEL || 'gpt-4o' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKING_REVIEW: ${{ vars.BLOCKING_REVIEW || 'false' }}
        run: |
          agent --force --model "$MODEL" --output-format=text --print 'You are operating in a GitHub Actions runner performing automated code review. The gh CLI is available and authenticated via GH_TOKEN. You may comment on pull requests.

          **Mandatory: Use the project review rules**
          - Read the file CODING_STANDARDS.md in the repository root (it is in the current working directory).
          - Use the entire document as the project coding standards. Pay special attention to the section「コードレビュー指摘事項（繰り返さないためのまとめ）」for review criteria to apply and to avoid repeating past feedback.
          - Flag violations of CODING_STANDARDS.md in addition to the high-severity issues listed below.

          Context:
          - Repo: ${{ github.repository }}
          - PR Number: ${{ github.event.pull_request.number }}
          - PR Head SHA: ${{ github.event.pull_request.head_sha }}
          - PR Base SHA: ${{ github.event.pull_request.base.sha }}
          - Blocking Review: ${{ env.BLOCKING_REVIEW }}

          Objectives:
          1) Re-check existing review comments and reply resolved when addressed.
          2) Review the current PR diff and flag only clear, high-severity issues and violations of CODING_STANDARDS.md.
          3) Leave very short inline comments (1-2 sentences) on changed lines only and a brief summary at the end.

          Procedure:
          - Read CODING_STANDARDS.md first, then get existing comments: gh pr view ${{ github.event.pull_request.number }} --json comments
          - Get diff: gh pr diff ${{ github.event.pull_request.number }}
          - Get changed files with patches: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate --jq ".[] | {filename,patch}"
          - Compute exact inline anchors for each issue (file path + diff position). Comments MUST be placed inline on the changed line in the diff, not as top-level comments.
          - If a previously reported issue appears fixed by nearby changes, reply: ✅ This issue appears to be resolved by the recent changes
          - Analyze for: (1) Violations of CODING_STANDARDS.md (including コードレビュー指摘事項), (2) Null/undefined dereferences, Resource leaks, Injection (SQL/XSS), Concurrency/race conditions, Missing error handling for critical operations, Obvious logic errors, Clear performance anti-patterns, Definitive security vulnerabilities.
          - Avoid duplicates: skip if similar feedback already exists on or near the same lines.

          Commenting rules:
          - Max 10 inline comments total; prioritize the most critical issues and CODING_STANDARDS violations
          - One issue per comment; place on the exact changed line
          - All issue comments MUST be inline (anchored to file and line/position in the PR diff)
          - Natural tone, specific and actionable; do not mention automated or high-confidence
          - Use emojis: 🚨 Critical 🔒 Security ⚡ Performance ⚠️ Logic ✅ Resolved ✨ Improvement

          Submission:
          - If there are NO issues to report and NO prior "no issues" comment exists, submit one brief summary comment noting no issues.
          - If there ARE issues to report, submit ONE review containing ONLY inline comments plus an optional concise summary body. Use the GitHub Reviews API so comments are inline.
          - Do NOT use: gh pr review --approve or --request-changes

          Blocking behavior:
          - If BLOCKING_REVIEW is true and any 🚨 or 🔒 issues were posted: echo "CRITICAL_ISSUES_FOUND=true" >> $GITHUB_ENV
          - Otherwise: echo "CRITICAL_ISSUES_FOUND=false" >> $GITHUB_ENV
          - Always set CRITICAL_ISSUES_FOUND at the end
          '

      - name: Check blocking review results
        if: env.BLOCKING_REVIEW == 'true'
        run: |
          echo "Checking for critical issues..."
          echo "CRITICAL_ISSUES_FOUND: ${CRITICAL_ISSUES_FOUND:-unset}"
          if [ "${CRITICAL_ISSUES_FOUND:-false}" = "true" ]; then
            echo "❌ Critical issues found and blocking review is enabled. Failing the workflow."
            exit 1
          else
            echo "✅ No blocking issues found."
          fi
